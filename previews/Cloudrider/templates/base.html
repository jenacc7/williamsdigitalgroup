<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}CloudRider Aviation | Personal Flight{% endblock %}</title>

    <meta name="description"
          content="{% block meta_description %}CloudRider Aviation offers personal flying aircraft, hands-on pilot training, delivery support, and U.S.-based ownership assistance.{% endblock %}">

    <meta property="og:title"
          content="{% block og_title %}CloudRider Aviation{% endblock %}">

    <meta property="og:description"
          content="{% block og_description %}Experience personal flight with real training, real support, and real-world S-Zero flight experience.{% endblock %}">

    <meta property="og:type" content="website">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>


<header class="site-header">

    <div class="nav-wrap">


        <!-- LOGO -->

        <a href="{{ url_for('home') }}"
           class="brand">

            <img
                src="{{ url_for('static', filename='images/cloudrider-logo.jpeg') }}"
                alt="CloudRider Aviation"
                class="site-logo">

        </a>


        <!-- NAVIGATION -->

        <nav class="main-nav">

            <a href="{{ url_for('aircraft') }}">
                Aircraft
            </a>

            <a href="{{ url_for('pricing') }}">
                Pricing
            </a>

            <a href="{{ url_for('training') }}">
                Training
            </a>

            <a href="{{ url_for('about') }}">
                Why CloudRider
            </a>

            <a href="{{ url_for('contact') }}">
                Contact
            </a>

            <a href="{{ url_for('contact') }}"
               class="nav-button">

                Request Info

            </a>

        </nav>


    </div>

</header>


<main>

    {% block content %}{% endblock %}

</main>


<footer class="site-footer">


    <div class="footer-wrap">


        <!-- FOOTER BRAND -->

        <div class="footer-brand">

            <img
                src="{{ url_for('static', filename='images/cloudrider-logo.jpeg') }}"
                alt="CloudRider Aviation"
                class="footer-logo">

            <p>
                Personal flight.<br>
                Real training.<br>
                Real support.
            </p>

        </div>


        <!-- FOOTER LINKS -->

        <div class="footer-links">

            <a href="{{ url_for('aircraft') }}">
                Aircraft
            </a>

            <a href="{{ url_for('pricing') }}">
                Pricing
            </a>

            <a href="{{ url_for('training') }}">
                Training
            </a>

            <a href="{{ url_for('about') }}">
                Why CloudRider
            </a>

            <a href="{{ url_for('contact') }}">
                Contact
            </a>

        </div>


    </div>


    <div class="footer-bottom">

        <p>
            © 2026 CloudRider Aviation. All rights reserved.
        </p>

    </div>


</footer>


</body>
</html>
