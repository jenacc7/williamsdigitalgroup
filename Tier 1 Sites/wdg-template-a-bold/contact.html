<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>NovaWorks | Contact</title>
  <link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body>

<div class="topbar">
  <div class="container nav">
    <a class="brand" href="index.html">
      <img src="assets/img/logo.svg" alt="Logo">
      <span>NovaWorks</span>
    </a>
    <div class="menu">
      <a href="offerings.html">Offerings</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
    <a class="btn primary" href="contact.html">Get a Quote</a>
  </div>
</div>

<section class="section">
  <div class="container split">
    <div class="panel">
      <h2>Contact</h2>
      <p class="kicker">For a static demo, this form does not submit anywhere yet. We can wire it later.</p>
      <div class="badges">
        <div class="badge">Phone: (859) 555-0199</div>
        <div class="badge">Email: hello@novaworks.com</div>
      </div>
    </div>

    <div class="panel">
      <h2>Request a Quote</h2>
      <form class="form">
        <div>
          <label>Name</label>
          <input type="text" placeholder="Your name">
        </div>
        <div>
          <label>Phone or Email</label>
          <input type="text" placeholder="(859) 555-0199">
        </div>
        <div>
          <label>Message</label>
          <textarea placeholder="Tell us what you need..."></textarea>
        </div>
        <button class="btn primary" type="button">Send</button>
      </form>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <small>© 2026 NovaWorks Demo Site</small>
    <small>Built by Williams Digital Group</small>
  </div>
</footer>

</body>
</html>
